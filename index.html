<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>LED Sign Board</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--panel:#15171b;--line:#2c3038;--text:#eef0f4;--mute:#9298a4;--acc:#ffb000}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:var(--text);font:15px/1.6 "Noto Sans Myanmar","Myanmar Text",Padauk,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
body{position:relative}
canvas{position:fixed;inset:0;display:block;background:#000;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar{position:fixed;z-index:5;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px;transition:opacity .22s ease}
body.idle .bar{opacity:0;pointer-events:none}
.pill{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:rgba(21,23,27,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#toast{position:fixed;z-index:20;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,420px);padding:12px 16px;border-radius:12px;background:rgba(15,17,20,.96);border:1px solid var(--line);color:var(--text);font-size:14px;opacity:0;transition:opacity .2s ease,transform .2s ease;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#panel{position:fixed;z-index:10;left:0;right:0;bottom:0;margin:0 auto;max-width:min(92vw,560px);width:min(92vw,560px);max-height:min(82vh,560px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:12px 14px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(calc(100% + 12px));transition:transform .24s ease,opacity .24s ease;box-shadow:0 -18px 60px rgba(0,0,0,.45)}
#panel.open{transform:none}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.f{display:block;margin:0 0 14px}
.f>span,.lbl{display:block;color:var(--mute);font-size:13px;margin-bottom:6px}
textarea{width:100%;resize:none;background:#0d0e11;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text;min-height:82px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:#0d0e11;font-size:14px;padding:6px 4px;line-height:1.4}
.seg button[aria-pressed=true]{border-color:var(--acc);color:var(--acc);background:#1d1a10}
input[type=range]{width:100%;height:32px;accent-color:var(--acc)}
.sw{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line);padding:0;background:transparent}
.sw button[aria-pressed=true]{border-color:#fff}
.sw input{width:44px;height:40px;border:0;background:none;padding:0}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;margin:0 0 4px}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.go{display:flex;gap:8px;margin-top:10px}
.go button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#0d0e11}
.go .main{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:700}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}.lang{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent}
@media (max-width:460px){
  .bar{gap:6px;right:calc(8px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px))}
  .pill{min-height:40px;padding:0 14px;border-radius:999px;font-size:14px}
  textarea{font-size:15px;min-height:74px}
  .seg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg button{font-size:13px;padding:8px 6px}
  .sw{gap:8px}
  .sw button{width:36px;height:36px}
  .sw input{width:40px;height:36px}
  .go button{min-height:46px}
  .foot{font-size:12px}
  .lang{min-height:32px;padding:0 10px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="bar" id="bar">
  <button class="pill" id="edit">Edit</button>
  <button class="pill" id="fs">Full screen</button>
</div>
<div id="toast" role="status"></div>

<section id="panel" aria-label="Sign settings">
  <div class="grip"></div>
  <label class="f"><span data-t="message">Message</span><textarea id="txt" rows="3" maxlength="300" placeholder="Type your message"></textarea></label>
  <div class="f"><span data-t="effect">Effect</span>
    <div class="seg" id="mode">
      <button data-v="left" data-t="left">Scroll left</button>
      <button data-v="right" data-t="right">Scroll right</button>
      <button data-v="still" data-t="still">Still</button>
      <button data-v="blink" data-t="blink">Blink</button>
    </div>
  </div>
  <label class="f"><span data-t="speed">Scroll speed</span><input type="range" id="speed" min="5" max="120"></label>
  <label class="f"><span data-t="size">Text size</span><input type="range" id="size" min="30" max="100"></label>
  <label class="f"><span data-t="dot">Dot size</span><input type="range" id="dot" min="5" max="22"></label>
  <div class="f"><span data-t="color">Colour</span>
    <div class="sw" id="sw"></div>
  </div>
  <label class="chk"><input type="checkbox" id="rot"> <span data-t="rot">Turn sign sideways (hold phone upright)</span></label>
  <label class="chk"><input type="checkbox" id="mir"> <span data-t="mir">Mirror text</span></label>
  <div class="go">
    <button id="fs2">Full screen</button>
    <button class="main" id="done">Show sign</button>
  </div>
  <div class="foot"><button class="lang" id="lang" type="button">English</button><span>Vibe Coded By Thio</span></div>
</section>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var S={lang:'my',text:'ကြိုဆိုပါတယ်! စာသားပြင်ရန် စခရင်ကို နှိပ်ပါ',mode:'left',speed:40,size:72,dot:10,color:'#ffb000',rot:false,mir:false};
try{Object.assign(S,JSON.parse(localStorage.getItem('ledsign')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('ledsign',JSON.stringify(S))}catch(e){}}
var T={
  my:{title:'LED ဆိုင်းဘုတ်',def:'ကြိုဆိုပါတယ်! စာသားပြင်ရန် စခရင်ကို နှိပ်ပါ',edit:'ပြင်ရန်',fs:'စခရင်အပြည့်',xfs:'စခရင်အပြည့်မှ ထွက်မည်',message:'စာသား',ph:'သင့်စာသားကို ရေးပါ',effect:'အကျိုးသက်ရောက်မှု',left:'ဘယ်ဘက်သို့.Scroll',right:'ညာဘက်သို့.Scroll',still:'ရပ်နေ',blink:' blink',speed:'Scroll speed',size:'စာသားအရွယ်',dot:'အမှတ်အရွယ်',color:'အရောင်',rot:'တည်ငြိမ်အနေအထား',mir:'Mirror text',done:'သင့်အချက်ပြ',lang:'English',nofs:'ဤစက်ပစ္စည်းတွင် စခရင်အပြည့်အသုံးမပြုနိုင်ပါ'},
  en:{title:'LED Sign Board',def:'WELCOME! TAP THE SCREEN TO EDIT',edit:'Edit',fs:'Full screen',xfs:'Exit full screen',message:'Message',ph:'Type your message',effect:'Effect',left:'Scroll left',right:'Scroll right',still:'Still',blink:'Blink',speed:'Scroll speed',size:'Text size',dot:'Dot size',color:'Colour',rot:'Turn sign sideways (hold phone upright)',mir:'Mirror text',done:'Show sign',lang:'မြန်မာ',nofs:'Full screen is not available on this device'}
};
if(!T[S.lang])S.lang='my';
if(S.text===T.en.def)S.text=T[S.lang].def;
function tr(k){return (T[S.lang] && T[S.lang][k]) || (T.en && T.en[k]) || ''}
var COLORS=['#ffb000','#ff2a2a','#22ff66','#22d3ff','#ff4fd8','#f4f4ff'];
var FONT='"Arial Black","Helvetica Neue",Arial,"Noto Sans Myanmar","Myanmar Text",Padauk,system-ui,sans-serif';
var cv=$('cv'),ctx=cv&&cv.getContext&&cv.getContext('2d');
var W,H,dpr,cols,rows,pitch,ox,oy,sprite,grid,msk,mw=1,period=1,off=0,last=0;

function hexA(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'}
function getViewport(){
  var vp=window.visualViewport;
  return {w: vp ? vp.width : window.innerWidth, h: vp ? vp.height : window.innerHeight};
}
function layout(){
  if(!cv || !ctx)return;
  dpr=Math.min(window.devicePixelRatio||1,2);
  var v=getViewport();
  W=S.rot?v.h:v.w;
  H=S.rot?v.w:v.h;
  cv.width=Math.round(W*dpr);
  cv.height=Math.round(H*dpr);
  cv.style.width=W+'px';
  cv.style.height=H+'px';
  cv.style.transformOrigin='center center';
  cv.style.transform=S.rot ? 'rotate(90deg)' : 'none';
  pitch=S.dot;
  cols=Math.max(1,Math.floor(W/pitch));
  rows=Math.max(1,Math.floor(H/pitch));
  ox=(W-cols*pitch)/2;
  oy=(H-rows*pitch)/2;
  restyle();
  rebuild();
}

function restyle(){
  if(!cv || !ctx)return;
  var pd=pitch*dpr,g=Math.ceil(pd*2.6),c=document.createElement('canvas');
  c.width=c.height=g;
  var x=c.getContext('2d'),m=g/2,r=pd*0.4;
  var gr=x.createRadialGradient(m,m,r*0.5,m,m,g/2);
  gr.addColorStop(0,hexA(S.color,.4));gr.addColorStop(1,hexA(S.color,0));
  x.fillStyle=gr;x.fillRect(0,0,g,g);
  x.fillStyle=S.color;x.beginPath();x.arc(m,m,r,0,7);x.fill();
  x.fillStyle='rgba(255,255,255,.4)';x.beginPath();x.arc(m,m,r*.45,0,7);x.fill();
  sprite=c;
  grid=document.createElement('canvas');grid.width=cv.width;grid.height=cv.height;
  var gx=grid.getContext('2d'),dr=pd*0.34;
  gx.fillStyle=hexA(S.color,.1);gx.beginPath();
  for(var j=0;j<rows;j++)for(var i=0;i<cols;i++){
    var px=(ox+(i+.5)*pitch)*dpr,py=(oy+(j+.5)*pitch)*dpr;
    gx.moveTo(px+dr,py);gx.arc(px,py,dr,0,7);
  }
  gx.fill();
}

function tok(p){
  try{if(window.Intl&&Intl.Segmenter&&/[\u1000-\u109F]/.test(p))return Array.from(new Intl.Segmenter('my',{granularity:'word'}).segment(p),function(g){return g.segment})}catch(e){}
  return p.split(/(\s+)/).filter(Boolean);
}
function wrapLines(x,ls,mw){
  var out=[];
  ls.forEach(function(p){
    var cur='';
    tok(p).forEach(function(w){
      var n=cur+w;
      if(!cur.trim()||x.measureText(n.trim()).width<=mw)cur=n;
      else{out.push(cur.trim());cur=w.trim()?w:''}
    });
    out.push(cur.trim());
  });
  return out.filter(function(l){return l});
}
function rebuild(){
  if(!cols || !ctx)return;
  var raw=(S.text||'').replace(/\r/g,''),c,x,fs;
  var lines=raw.split('\n').map(function(s){return s.trim()}).filter(Boolean);
  if(!lines.length)lines=[' '];
  var k=/[\u1000-\u109F]/.test(raw)?0.78:1;
  if(S.mode==='left'||S.mode==='right'){
    var txt=lines.join('   ');
    fs=Math.max(4,rows*S.size/100*k);
    c=document.createElement('canvas');x=c.getContext('2d');
    x.font='700 '+fs+'px '+FONT;
    var w=Math.max(1,Math.ceil(x.measureText(txt).width)+2);
    c.width=w;c.height=rows;
    x.font='700 '+fs+'px '+FONT;x.fillStyle='#fff';x.textBaseline='middle';
    x.fillText(txt,1,rows/2+fs*0.04);
    mw=w;period=w+Math.round(cols*.4);
  }else{
    c=document.createElement('canvas');c.width=cols;c.height=rows;x=c.getContext('2d');
    var lh=k<1?1.25:1,maxW=cols-2,out=[];
    fs=rows*S.size/100*k;
    for(var n=0;n<60;n++){
      x.font='700 '+fs+'px '+FONT;
      out=wrapLines(x,lines,maxW);
      var wd=Math.max.apply(null,out.map(function(l){return x.measureText(l).width}));
      if(out.length*fs*lh<=rows&&wd<=maxW)break;
      fs*=0.93;if(fs<3)break;
    }
    x.font='700 '+fs+'px '+FONT;x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';
    var y0=(rows-out.length*fs*lh)/2;
    out.forEach(function(l,i){x.fillText(l,cols/2,y0+(i+.5)*fs*lh+fs*0.04)});
    mw=cols;period=cols;
  }
  var d=x.getImageData(0,0,c.width,c.height).data;
  msk=new Uint8Array(c.width*c.height);
  for(var i=0;i<msk.length;i++)msk[i]=d[i*4+3]>100?1:0;
  off=0;
}

function frame(t){
  if(!cv || !ctx)return;
  var dt=Math.min(.1,(t-last)/1000||0);last=t;
  var scroll=S.mode==='left'||S.mode==='right';
  if(scroll){off+=(S.mode==='left'?1:-1)*S.speed*dt;off=((off%period)+period)%period}
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  if(grid)ctx.drawImage(grid,0,0);
  var lit=S.mode !== 'blink' || Math.floor(t/600)%2===0;
  if(lit&&msk&&sprite){
    ctx.globalCompositeOperation='lighter';
    var hf=sprite.width/2,base=Math.floor(off);
    for(var c=0;c<cols;c++){
      var sc=scroll?(base+c)%period:c;
      if(sc>=mw)continue;
      var dc=S.mir?cols-1-c:c;
      var px=Math.round((ox+(dc+.5)*pitch)*dpr-hf);
      for(var r=0;r<rows;r++){
        if(msk[r*mw+sc])ctx.drawImage(sprite,px,Math.round((oy+(r+.5)*pitch)*dpr-hf));
      }
    }
    ctx.globalCompositeOperation='source-over';
  }
  requestAnimationFrame(frame);
}

var panel=$('panel'),hideT,toastT;
function poke(){
  document.body.classList.remove('idle');
  clearTimeout(hideT);
  if(!panel.classList.contains('open'))hideT=setTimeout(function(){document.body.classList.add('idle')},3000);
}
function setPanel(o){panel.classList.toggle('open',o);poke()}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},4200)}

var sw=$('sw');
COLORS.forEach(function(c){
  var b=document.createElement('button');b.style.background=c;b.dataset.c=c;b.setAttribute('aria-label','Colour '+c);
  b.onclick=function(){S.color=c;sync();restyle();save()};sw.appendChild(b);
});
var cp=document.createElement('input');cp.type='color';cp.setAttribute('aria-label','Custom colour');
cp.oninput=function(){S.color=cp.value;sync();restyle();save()};sw.appendChild(cp);

function apply(){
  document.documentElement.lang=S.lang;document.title=tr('title');
  document.querySelectorAll('[data-t]').forEach(function(e){var key=e.dataset.t; e.textContent=tr(key) || e.textContent;});
  $('edit').textContent=tr('edit');$('done').textContent=tr('done');$('lang').textContent=tr('lang');$('txt').placeholder=tr('ph');
  var f=fsEl()?'xfs':'fs';$('fs').textContent=tr(f);$('fs2').textContent=tr(f);
}
function sync(){
  apply();
  $('txt').value=S.text;$('speed').value=S.speed;$('size').value=S.size;$('dot').value=S.dot;
  $('rot').checked=!!S.rot;$('mir').checked=!!S.mir;cp.value=S.color;
  document.querySelectorAll('#mode button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===S.mode))});
  sw.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.c===S.color))});
}
$('txt').oninput=function(){S.text=this.value;rebuild();save()};
document.querySelectorAll('#mode button').forEach(function(b){b.onclick=function(){S.mode=b.dataset.v;sync();rebuild();save()}});
$('speed').oninput=function(){S.speed=+this.value;save()};
$('size').oninput=function(){S.size=+this.value;rebuild();save()};
$('dot').oninput=function(){S.dot=+this.value;layout();save()};
$('rot').onchange=function(){S.rot=this.checked;layout();save()};
$('mir').onchange=function(){S.mir=this.checked;save()};
$('edit').onclick=function(){setPanel(!panel.classList.contains('open'))};
$('done').onclick=function(){setPanel(false)};
$('lang').onclick=function(){var o=S.lang;S.lang=o==='my'?'en':'my';if(S.text===T[o].def)S.text=T[S.lang].def;sync();rebuild();save()};
cv.addEventListener('pointerdown',function(){lock();if(panel.classList.contains('open'))setPanel(false);else poke()});

var root=document.documentElement;
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement}
function toggleFS(){
  var req=root.requestFullscreen||root.webkitRequestFullscreen;
  if(fsEl()){
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    return;
  }
  setPanel(false);
  if(!req){noFS();return}
  try{var p=req.call(root);if(p&&p.catch)p.catch(noFS)}catch(e){noFS()}
}
function noFS(){toast(tr('nofs')||'Full screen is not available on this device')}
function fsLabel(){apply();layout();poke()}
$('fs').onclick=toggleFS;$('fs2').onclick=toggleFS;
document.addEventListener('fullscreenchange',fsLabel);
document.addEventListener('webkitfullscreenchange',fsLabel);

var wl=null;
function lock(){
  try{
    if('wakeLock' in navigator && !wl && navigator.wakeLock && navigator.wakeLock.request){
      navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)lock()});

var rz;
function onResize(){cancelAnimationFrame(rz);rz=requestAnimationFrame(layout)}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);

sync();layout();lock();poke();
try{if(document.fonts&&document.fonts.load){document.fonts.load('700 20px "Noto Sans Myanmar"','က').then(rebuild).catch(function(){})}}catch(e){}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
