<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LED Sign">
<meta name="mobile-web-app-capable" content="yes">

<title>LED Sign Board</title>

<link id="manifestLink" rel="manifest">
<link id="faviconLink" rel="icon" type="image/svg+xml">
<link id="appleIconLink" rel="apple-touch-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --bg: #08090c;
  --panel: #15171d;
  --surface: #0d0f14;
  --line: #292d37;
  --text: #f4f5f8;
  --muted: #9299a8;
  --accent: #ffb000;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #000;
  color: var(--text);
  font-family: "Noto Sans Myanmar", "Myanmar Text",
    Padauk, system-ui, sans-serif;
  overscroll-behavior: none;
}

body {
  touch-action: manipulation;
}

button, input, textarea {
  font: inherit;
}

button {
  color: inherit;
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

#display {
  position: fixed;
  left: 50%;
  top: 50%;
  display: block;
  background: #000;
  transform-origin: center center;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

.topbar {
  position: fixed;
  z-index: 5;
  top: calc(12px + env(safe-area-inset-top));
  right: calc(12px + env(safe-area-inset-right));
  display: flex;
  gap: 8px;
  transition: opacity .2s;
}

body.idle .topbar {
  opacity: 0;
  pointer-events: none;
}

.pill {
  min-height: 44px;
  padding: 0 17px;
  border: 1px solid #343944;
  border-radius: 30px;
  background: rgba(22,24,30,.88);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

#panel {
  position: fixed;
  z-index: 10;
  left: 50%;
  bottom: 0;
  width: min(94vw, 560px);
  max-height: 86vh;
  max-height: 86dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 12px 16px calc(20px + env(safe-area-inset-bottom));
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 22px 22px 0 0;
  background: var(--panel);
  box-shadow: 0 -15px 55px #0009;
  transform: translate(-50%, 110%);
  transition: transform .25s ease;
}

#panel.open {
  transform: translate(-50%, 0);
}

.grip {
  width: 42px;
  height: 4px;
  margin: 0 auto 16px;
  border-radius: 10px;
  background: #444956;
}

.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.heading h2 {
  margin: 0;
  font-size: 18px;
}

.heading small {
  color: var(--muted);
  font-size: 12px;
}

.field {
  margin-bottom: 16px;
}

.field > label,
.field > .label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 13px;
}

textarea {
  display: block;
  width: 100%;
  min-height: 85px;
  padding: 12px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
  line-height: 1.6;
  user-select: text;
  -webkit-user-select: text;
}

.segment {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.segment button {
  min-height: 42px;
  padding: 8px 4px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  font-size: 13px;
}

.segment button.active {
  border-color: var(--accent);
  color: var(--accent);
  background: #ffb00012;
}

input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
  cursor: pointer;
}

.range-info {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
}

.colors {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}

.color {
  width: 34px;
  height: 34px;
  padding: 0;
  border: 2px solid transparent;
  border-radius: 50%;
  background: var(--color);
  box-shadow: 0 0 0 1px #555;
}

.color.active {
  border-color: white;
  box-shadow: 0 0 0 2px var(--color);
}

#customColor {
  width: 38px;
  height: 38px;
  padding: 0;
  border: 0;
  background: none;
}

.checks {
  display: grid;
  gap: 10px;
}

.check {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 36px;
  font-size: 13px;
}

.check input {
  width: 19px;
  height: 19px;
  accent-color: var(--accent);
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 18px;
}

.actions button {
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
}

.actions .primary {
  border-color: var(--accent);
  background: var(--accent);
  color: #171000;
  font-weight: 800;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 17px;
  padding-top: 13px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
}

.footer button {
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: transparent;
}

#toast {
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom));
  max-width: 90vw;
  padding: 11px 17px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #191b21;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 15px);
  transition: .2s;
}

#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-width: 420px) {
  #panel {
    width: 100%;
    max-height: 88vh;
    max-height: 88dvh;
  }

  .segment button {
    font-size: 12px;
  }

  .pill {
    min-height: 40px;
    padding: 0 13px;
    font-size: 13px;
  }
}

@media (prefers-reduced-motion: reduce) {
  #panel, #toast, .topbar {
    transition-duration: .01ms;
  }
}
</style>
</head>

<body>

<canvas id="display"></canvas>

<div class="topbar">
  <button class="pill" id="editBtn">Edit</button>
  <button class="pill" id="fullBtn">Full screen</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<section id="panel" aria-label="LED settings">
  <div class="grip"></div>

  <div class="heading">
    <h2>LED Sign Board</h2>
    <small>PWA · SINGLE FILE</small>
  </div>

  <div class="field">
    <label for="message" data-i18n="message">Your message</label>
    <textarea id="message" maxlength="300"
      placeholder="Type your message..."></textarea>
  </div>

  <div class="field">
    <span class="label" data-i18n="effect">Animation effect</span>
    <div class="segment" id="effects">
      <button data-mode="left">← Left</button>
      <button data-mode="right">Right →</button>
      <button data-mode="up">↑ Up</button>
      <button data-mode="down">↓ Down</button>
      <button data-mode="still">Still</button>
      <button data-mode="blink">Blink</button>
    </div>
  </div>

  <div class="field">
    <label for="speed" data-i18n="speed">Animation speed</label>
    <input type="range" id="speed" min="5" max="150" value="40">
    <div class="range-info">
      <span>Slow</span><span id="speedValue">40</span><span>Fast</span>
    </div>
  </div>

  <div class="field">
    <label for="size" data-i18n="size">Text size</label>
    <input type="range" id="size" min="30" max="100" value="72">
    <div class="range-info">
      <span>Small</span><span id="sizeValue">72%</span><span>Large</span>
    </div>
  </div>

  <div class="field">
    <label for="dot" data-i18n="dot">LED dot size</label>
    <input type="range" id="dot" min="4" max="24" value="10">
    <div class="range-info">
      <span>Fine</span><span id="dotValue">10 px</span><span>Large</span>
    </div>
  </div>

  <div class="field">
    <label for="brightness" data-i18n="brightness">Brightness</label>
    <input type="range" id="brightness" min="10" max="100" value="100">
    <div class="range-info">
      <span>Dim</span><span id="brightnessValue">100%</span><span>Bright</span>
    </div>
  </div>

  <div class="field">
    <span class="label" data-i18n="color">LED colour</span>
    <div class="colors" id="colors">
      <button class="color" style="--color:#ffb000"
        data-color="#ffb000" aria-label="Amber"></button>
      <button class="color" style="--color:#ff2525"
        data-color="#ff2525" aria-label="Red"></button>
      <button class="color" style="--color:#22ff66"
        data-color="#22ff66" aria-label="Green"></button>
      <button class="color" style="--color:#22d3ff"
        data-color="#22d3ff" aria-label="Blue"></button>
      <button class="color" style="--color:#ff4fd8"
        data-color="#ff4fd8" aria-label="Pink"></button>
      <button class="color" style="--color:#ffffff"
        data-color="#ffffff" aria-label="White"></button>
      <input type="color" id="customColor"
        value="#ffb000" aria-label="Custom colour">
    </div>
  </div>

  <div class="field checks">
    <label class="check">
      <input type="checkbox" id="rotate">
      <span data-i18n="rotate">Rotate display 90°</span>
    </label>

    <label class="check">
      <input type="checkbox" id="mirror">
      <span data-i18n="mirror">Mirror text</span>
    </label>

    <label class="check">
      <input type="checkbox" id="glow" checked>
      <span data-i18n="glow">LED glow effect</span>
    </label>
  </div>

  <div class="actions">
    <button id="installBtn" hidden>Install app</button>
    <button id="fullBtn2">Full screen</button>
    <button class="primary" id="showBtn">Show sign</button>
  </div>

  <div class="footer">
    <button id="languageBtn">မြန်မာ</button>
    <span>Vibe Coded By Thio</span>
  </div>
</section>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);

const canvas = $('display');
const ctx = canvas.getContext('2d', { alpha: false });

const DEFAULTS = {
  message: 'ကြိုဆိုပါတယ်! စာသားပြင်ရန် စခရင်ကို နှိပ်ပါ',
  mode: 'left',
  speed: 40,
  size: 72,
  dot: 10,
  brightness: 100,
  color: '#ffb000',
  rotate: false,
  mirror: false,
  glow: true,
  lang: 'my'
};

const modes = ['left', 'right', 'up', 'down', 'still', 'blink'];

let settings = { ...DEFAULTS };

try {
  const stored = JSON.parse(localStorage.getItem('ledsign-v2') || '{}');

  if (stored && typeof stored === 'object' && !Array.isArray(stored)) {
    settings = { ...settings, ...stored };
  }
} catch (error) {
  console.warn('Settings could not be loaded.', error);
}

if (!['my', 'en'].includes(settings.lang)) settings.lang = 'my';
if (!modes.includes(settings.mode)) settings.mode = 'left';

settings.message = typeof settings.message === 'string'
  ? settings.message.slice(0, 300)
  : DEFAULTS.message;

const limits = {
  speed: [5, 150],
  size: [30, 100],
  dot: [4, 24],
  brightness: [10, 100]
};

Object.keys(limits).forEach(key => {
  const value = Number(settings[key]);
  const [min, max] = limits[key];

  settings[key] = Number.isFinite(value)
    ? Math.max(min, Math.min(max, value))
    : DEFAULTS[key];
});

if (!/^#[0-9a-f]{6}$/i.test(settings.color)) {
  settings.color = DEFAULTS.color;
}

settings.rotate = settings.rotate === true;
settings.mirror = settings.mirror === true;
settings.glow = settings.glow !== false;

const translations = {
  en: {
    edit: 'Edit',
    fullscreen: 'Full screen',
    exit: 'Exit full screen',
    message: 'Your message',
    placeholder: 'Type your message...',
    effect: 'Animation effect',
    left: '← Left',
    right: 'Right →',
    up: '↑ Up',
    down: '↓ Down',
    still: 'Still',
    blink: 'Blink',
    speed: 'Animation speed',
    size: 'Text size',
    dot: 'LED dot size',
    brightness: 'Brightness',
    color: 'LED colour',
    rotate: 'Rotate display 90°',
    mirror: 'Mirror text',
    glow: 'LED glow effect',
    show: 'Show sign',
    language: 'မြန်မာ',
    install: 'Install app',
    unavailable: 'Fullscreen is unavailable.'
  },

  my: {
    edit: 'ပြင်ရန်',
    fullscreen: 'စခရင်အပြည့်',
    exit: 'ပြန်ထွက်ရန်',
    message: 'ပြသမည့်စာသား',
    placeholder: 'စာသားရေးပါ...',
    effect: 'ပြသမှုပုံစံ',
    left: '← ဘယ်',
    right: 'ညာ →',
    up: '↑ အပေါ်',
    down: '↓ အောက်',
    still: 'ရပ်ထား',
    blink: 'မှိတ်တုတ်',
    speed: 'ရွေ့လျားနှုန်း',
    size: 'စာသားအရွယ်',
    dot: 'LED အစက်အရွယ်',
    brightness: 'အလင်းအား',
    color: 'LED အရောင်',
    rotate: '၉၀ ဒီဂရီ လှည့်ရန်',
    mirror: 'စာသားကို ပြောင်းပြန်ပြရန်',
    glow: 'LED အလင်းဝန်းဖွင့်ရန်',
    show: 'ပြသရန်',
    language: 'English',
    install: 'App ထည့်သွင်းရန်',
    unavailable: 'စခရင်အပြည့် မရနိုင်ပါ။'
  }
};

const t = key => translations[settings.lang][key] || key;

let logicalWidth = 0;
let logicalHeight = 0;
let cols = 0;
let rows = 0;
let pitch = 10;
let dpr = 1;

let offset = 0;
let lastTime = 0;

let maskCanvas = null;
let maskCtx = null;
let maskWidth = 1;
let maskHeight = 1;
let maskData = null;

let gridCanvas = null;
let glowCanvas = null;
let glowKey = '';

let resizeTimer = null;
let rebuildQueued = false;
let wakeLock = null;
let hideTimer = null;
let toastTimer = null;
let installPrompt = null;

function hexToRgb(hex) {
  const clean = /^#[0-9a-f]{6}$/i.test(hex) ? hex : DEFAULTS.color;
  return {
    r: parseInt(clean.slice(1, 3), 16),
    g: parseInt(clean.slice(3, 5), 16),
    b: parseInt(clean.slice(5, 7), 16)
  };
}

function save() {
  try {
    localStorage.setItem('ledsign-v2', JSON.stringify(settings));
  } catch (error) {
    console.warn('Settings could not be saved.', error);
  }
}

function viewport() {
  const v = window.visualViewport;

  return {
    width: v ? v.width : window.innerWidth,
    height: v ? v.height : window.innerHeight
  };
}

function fontFamily() {
  return '"Noto Sans Myanmar","Myanmar Text",Padauk,Arial,sans-serif';
}

function splitText(text) {
  if (window.Intl && Intl.Segmenter) {
    const segmenter = new Intl.Segmenter(
      settings.lang === 'my' ? 'my' : 'en',
      { granularity: 'grapheme' }
    );

    return Array.from(
      segmenter.segment(text),
      item => item.segment
    );
  }

  return Array.from(text);
}

function wrapText(text, maxWidth, fontSize) {
  maskCtx.font = '900 ' + fontSize + 'px ' + fontFamily();

  const paragraphs = text.replace(/\r/g, '').split('\n');
  const lines = [];

  for (const paragraph of paragraphs) {
    if (!paragraph.trim()) {
      lines.push('');
      continue;
    }

    const words = paragraph.trim().split(/\s+/);
    let line = '';

    for (const word of words) {
      const candidate = line ? line + ' ' + word : word;

      if (maskCtx.measureText(candidate).width <= maxWidth) {
        line = candidate;
        continue;
      }

      if (line) lines.push(line);

      if (maskCtx.measureText(word).width > maxWidth) {
        let part = '';

        for (const char of splitText(word)) {
          const next = part + char;

          if (part && maskCtx.measureText(next).width > maxWidth) {
            lines.push(part);
            part = char;
          } else {
            part = next;
          }
        }

        line = part;
      } else {
        line = word;
      }
    }

    if (line) lines.push(line);
  }

  return lines.length ? lines : [' '];
}

function layout() {
  const v = viewport();

  logicalWidth = settings.rotate ? v.height : v.width;
  logicalHeight = settings.rotate ? v.width : v.height;

  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.max(1, Math.round(logicalWidth * dpr));
  canvas.height = Math.max(1, Math.round(logicalHeight * dpr));

  canvas.style.width = logicalWidth + 'px';
  canvas.style.height = logicalHeight + 'px';

  canvas.style.transform = settings.rotate
    ? 'translate(-50%, -50%) rotate(90deg)'
    : 'translate(-50%, -50%)';

  pitch = settings.dot;

  cols = Math.max(1, Math.floor(logicalWidth / pitch));
  rows = Math.max(1, Math.floor(logicalHeight / pitch));

  glowKey = '';
  buildGrid();
  buildMask();
}

function buildGrid() {
  gridCanvas = document.createElement('canvas');

  gridCanvas.width = canvas.width;
  gridCanvas.height = canvas.height;

  const gx = gridCanvas.getContext('2d');

  const radius = Math.max(0.6, pitch * dpr * 0.10);

  gx.fillStyle = 'rgba(255,255,255,0.10)';
  gx.beginPath();

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const px = (x + 0.5) * pitch * dpr;
      const py = (y + 0.5) * pitch * dpr;

      gx.moveTo(px + radius, py);
      gx.arc(px, py, radius, 0, Math.PI * 2);
    }
  }

  gx.fill();
}

function ensureGlowSprite(radius, glowRadius) {
  const key = `${settings.color}|${radius.toFixed(2)}|${glowRadius.toFixed(2)}`;
  if (glowCanvas && glowKey === key) return glowCanvas;

  const size = Math.max(2, Math.ceil(glowRadius * 2));
  const sprite = document.createElement('canvas');
  sprite.width = size;
  sprite.height = size;

  const sctx = sprite.getContext('2d');
  const { r, g, b } = hexToRgb(settings.color);
  const center = size / 2;

  const gradient = sctx.createRadialGradient(
    center, center, radius * 0.4,
    center, center, glowRadius
  );

  gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.67)`);
  gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

  sctx.fillStyle = gradient;
  sctx.beginPath();
  sctx.arc(center, center, glowRadius, 0, Math.PI * 2);
  sctx.fill();

  glowCanvas = sprite;
  glowKey = key;
  return glowCanvas;
}

function buildMask() {
  if (!cols || !rows) return;

  const horizontal = settings.mode === 'left' ||
                     settings.mode === 'right';

  const vertical = settings.mode === 'up' ||
                   settings.mode === 'down';

  const message = settings.message || ' ';
  const isMyanmar = /[\u1000-\u109F]/.test(message);
  const factor = isMyanmar ? 0.78 : 0.9;

  maskCanvas = document.createElement('canvas');

  maskCtx = maskCanvas.getContext('2d', {
    willReadFrequently: true
  });

  let fs = Math.max(
    3,
    rows * settings.size / 100 * factor
  );

  if (horizontal) {
    maskCtx.font = '900 ' + fs + 'px ' + fontFamily();

    const text = message.replace(/\r/g, '').replace(/\n/g, '   ');
    const width = maskCtx.measureText(text).width;

    maskWidth = Math.max(1, Math.ceil(width + cols));
    maskHeight = rows;

    maskCanvas.width = maskWidth;
    maskCanvas.height = maskHeight;

    maskCtx = maskCanvas.getContext('2d', {
      willReadFrequently: true
    });

    maskCtx.font = '900 ' + fs + 'px ' + fontFamily();
    maskCtx.textAlign = 'left';
    maskCtx.textBaseline = 'middle';
    maskCtx.fillStyle = '#fff';

    maskCtx.fillText(text, cols / 2, rows / 2);

  } else {
    const staticMode = !vertical;
    const maxHeight = staticMode ? rows : Math.max(rows * 2, 1);

    maskWidth = cols;
    maskHeight = maxHeight;

    maskCanvas.width = maskWidth;
    maskCanvas.height = maskHeight;

    maskCtx = maskCanvas.getContext('2d', {
      willReadFrequently: true
    });

    let lines = [];

    for (let i = 0; i < 40; i++) {
      lines = wrapText(message, Math.max(1, cols - 2), fs);

      const lineHeight = fs * 1.25;
      const requiredHeight = lines.length * lineHeight;

      if (requiredHeight <= maxHeight - 2 || fs <= 3) break;

      fs *= 0.9;
    }

    maskCtx.font = '900 ' + fs + 'px ' + fontFamily();
    maskCtx.textAlign = 'center';
    maskCtx.textBaseline = 'middle';
    maskCtx.fillStyle = '#fff';

    const lineHeight = fs * 1.25;
    const totalHeight = lines.length * lineHeight;

    const startY = staticMode
      ? Math.max(1, (rows - totalHeight) / 2)
      : Math.max(1, (maxHeight - totalHeight) / 2);

    lines.forEach((line, index) => {
      maskCtx.fillText(
        line,
        cols / 2,
        startY + (index + 0.5) * lineHeight
      );
    });
  }

  const pixels = maskCtx.getImageData(
    0, 0, maskWidth, maskHeight
  ).data;

  maskData = new Uint8Array(maskWidth * maskHeight);

  for (let i = 0; i < maskData.length; i++) {
    maskData[i] = pixels[i * 4 + 3] > 90 ? 1 : 0;
  }

  offset = 0;
}

function queueRebuild() {
  if (rebuildQueued) return;

  rebuildQueued = true;

  requestAnimationFrame(() => {
    rebuildQueued = false;
    buildMask();
  });
}

function drawFrame(time) {
  const dt = lastTime
    ? Math.min((time - lastTime) / 1000, 0.05)
    : 0;

  lastTime = time;

  const horizontal = settings.mode === 'left' ||
                     settings.mode === 'right';

  const vertical = settings.mode === 'up' ||
                   settings.mode === 'down';

  if (horizontal || vertical) {
    const direction =
      settings.mode === 'left' ||
      settings.mode === 'up' ? 1 : -1;

    const extent = horizontal ? maskWidth : maskHeight;

    offset = (
      offset + direction * settings.speed * dt
    ) % extent;

    if (offset < 0) offset += extent;
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (gridCanvas) {
    ctx.drawImage(gridCanvas, 0, 0);
  }

  const color = settings.color;
  const brightness = settings.brightness / 100;

  const lit = settings.mode !== 'blink' ||
              Math.floor(time / 600) % 2 === 0;

  if (maskData && lit) {
    ctx.globalAlpha = brightness;

    const radius = Math.max(0.7, pitch * dpr * 0.32);
    const glowRadius = radius * 3.2;
    const sprite = settings.glow ? ensureGlowSprite(radius, glowRadius) : null;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        let sx = x;
        let sy = y;

        if (horizontal) {
          sx = Math.floor((x + Math.floor(offset)) % maskWidth);
        } else if (vertical) {
          sy = Math.floor((y + Math.floor(offset)) % maskHeight);
        }

        if (
          sx < 0 || sy < 0 ||
          sx >= maskWidth || sy >= maskHeight
        ) continue;

        if (!maskData[sy * maskWidth + sx]) continue;

        const dx = settings.mirror ? cols - 1 - x : x;

        const px = (dx + 0.5) * pitch * dpr;
        const py = (y + 0.5) * pitch * dpr;

        if (sprite) {
          ctx.drawImage(
            sprite,
            px - sprite.width / 2,
            py - sprite.height / 2
          );
        }

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(px, py, radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(drawFrame);
}

function toast(message) {
  const element = $('toast');

  element.textContent = message;
  element.classList.add('show');

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    element.classList.remove('show');
  }, 2500);
}

function poke() {
  document.body.classList.remove('idle');

  clearTimeout(hideTimer);

  if (!$('panel').classList.contains('open')) {
    hideTimer = setTimeout(() => {
      document.body.classList.add('idle');
    }, 3500);
  }
}

function openPanel(open) {
  $('panel').classList.toggle('open', open);
  poke();
}

function updateUI() {
  $('message').value = settings.message;
  $('message').placeholder = t('placeholder');

  ['speed', 'size', 'dot', 'brightness'].forEach(key => {
    $(key).value = settings[key];
  });

  $('speedValue').textContent = settings.speed;
  $('sizeValue').textContent = settings.size + '%';
  $('dotValue').textContent = settings.dot + ' px';
  $('brightnessValue').textContent = settings.brightness + '%';

  $('rotate').checked = settings.rotate;
  $('mirror').checked = settings.mirror;
  $('glow').checked = settings.glow;

  document.querySelectorAll('[data-i18n]').forEach(element => {
    const key = element.dataset.i18n;
    element.textContent = t(key);
  });

  document.querySelectorAll('[data-mode]').forEach(button => {
    button.classList.toggle(
      'active',
      button.dataset.mode === settings.mode
    );

    button.textContent = t(button.dataset.mode);
  });

  document.querySelectorAll('[data-color]').forEach(button => {
    button.classList.toggle(
      'active',
      button.dataset.color.toLowerCase() === settings.color.toLowerCase()
    );
  });

  $('customColor').value = settings.color;

  $('languageBtn').textContent = t('language');
  $('editBtn').textContent = t('edit');
  $('showBtn').textContent = t('show');

  const fullscreen = !!(
    document.fullscreenElement ||
    document.webkitFullscreenElement
  );

  $('fullBtn').textContent = fullscreen ? t('exit') : t('fullscreen');
  $('fullBtn2').textContent = fullscreen ? t('exit') : t('fullscreen');
  $('installBtn').textContent = t('install');
}

function change(key, value, rebuild = false) {
  settings[key] = value;

  save();

  if (rebuild) queueRebuild();

  updateUI();
}

// MESSAGE
$('message').addEventListener('input', event => {
  change('message', event.target.value, true);
});

// ANIMATION
document.querySelectorAll('[data-mode]').forEach(button => {
  button.addEventListener('click', () => {
    change('mode', button.dataset.mode, true);
  });
});

// SLIDERS
['speed', 'size', 'dot', 'brightness'].forEach(key => {
  $(key).addEventListener('input', event => {
    settings[key] = Number(event.target.value);

    if (key === 'dot') {
      layout();
    } else if (key === 'size') {
      queueRebuild();
    }

    save();
    updateUI();
  });
});

// CHECKBOXES
$('rotate').addEventListener('change', event => {
  change('rotate', event.target.checked);
  layout();
});

$('mirror').addEventListener('change', event => {
  change('mirror', event.target.checked);
});

$('glow').addEventListener('change', event => {
  change('glow', event.target.checked);
});

// COLORS
$('colors').addEventListener('click', event => {
  const button = event.target.closest('[data-color]');

  if (!button) return;

  change('color', button.dataset.color);
});

$('customColor').addEventListener('input', event => {
  change('color', event.target.value);
});

// LANGUAGE
$('languageBtn').addEventListener('click', () => {
  settings.lang = settings.lang === 'my' ? 'en' : 'my';

  save();
  updateUI();
});

// PANEL
$('editBtn').addEventListener('click', () => {
  openPanel(!$('panel').classList.contains('open'));
});

$('showBtn').addEventListener('click', () => {
  openPanel(false);
});

// FULLSCREEN
async function toggleFullscreen() {
  const current =
    document.fullscreenElement ||
    document.webkitFullscreenElement;

  try {
    if (current) {
      if (document.exitFullscreen) {
        await document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }

      return;
    }

    openPanel(false);

    const request =
      document.documentElement.requestFullscreen ||
      document.documentElement.webkitRequestFullscreen;

    if (!request) {
      toast(t('unavailable'));
      return;
    }

    await request.call(document.documentElement);

  } catch (error) {
    toast(t('unavailable'));
  }
}

$('fullBtn').addEventListener('click', toggleFullscreen);
$('fullBtn2').addEventListener('click', toggleFullscreen);

function fullscreenChanged() {
  layout();
  updateUI();
  poke();
}

document.addEventListener('fullscreenchange', fullscreenChanged);
document.addEventListener('webkitfullscreenchange', fullscreenChanged);

// WAKE LOCK
async function requestWakeLock() {
  if (
    !('wakeLock' in navigator) ||
    document.hidden ||
    wakeLock
  ) return;

  try {
    wakeLock = await navigator.wakeLock.request('screen');

    wakeLock.addEventListener('release', () => {
      wakeLock = null;
    });

  } catch (error) {
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) requestWakeLock();
});

canvas.addEventListener('pointerdown', () => {
  requestWakeLock();
  poke();

  if ($('panel').classList.contains('open')) {
    openPanel(false);
  }
});

// PWA INSTALL
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();

  installPrompt = event;
  $('installBtn').hidden = false;
});

$('installBtn').addEventListener('click', async () => {
  if (!installPrompt) return;

  installPrompt.prompt();

  await installPrompt.userChoice;

  installPrompt = null;
  $('installBtn').hidden = true;
});

window.addEventListener('appinstalled', () => {
  $('installBtn').hidden = true;
  toast('App installed successfully');
});

// RESIZE
function resize() {
  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {
    layout();
  }, 80);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);
}

// SINGLE-FILE PWA (ICON + MANIFEST + SERVICE WORKER)
function setupSingleFilePWA() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="112" fill="#08090c"/>
    <rect x="44" y="132" width="424" height="248" rx="36" fill="#12151d" stroke="#2c313d" stroke-width="12"/>
    <g fill="#ffb000">
      <circle cx="116" cy="216" r="18"/><circle cx="166" cy="216" r="18"/><circle cx="216" cy="216" r="18"/><circle cx="266" cy="216" r="18"/><circle cx="316" cy="216" r="18"/><circle cx="366" cy="216" r="18"/><circle cx="416" cy="216" r="18"/>
      <circle cx="116" cy="296" r="18"/><circle cx="216" cy="296" r="18"/><circle cx="316" cy="296" r="18"/><circle cx="416" cy="296" r="18"/>
    </g>
    <g fill="#2b303c">
      <circle cx="166" cy="296" r="14"/><circle cx="266" cy="296" r="14"/><circle cx="366" cy="296" r="14"/>
    </g>
  </svg>`;

  const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  $('faviconLink').href = iconUrl;
  $('appleIconLink').href = iconUrl;

  const manifest = {
    name: 'LED Sign Board',
    short_name: 'LED Sign',
    description: 'Customizable LED dot-matrix sign board with Myanmar Unicode support',
    start_url: location.href,
    scope: './',
    display: 'standalone',
    orientation: 'any',
    background_color: '#08090c',
    theme_color: '#08090c',
    icons: [
      {
        src: iconUrl,
        sizes: 'any',
        type: 'image/svg+xml',
        purpose: 'any maskable'
      }
    ]
  };

  const manifestBlob = new Blob(
    [JSON.stringify(manifest)],
    { type: 'application/manifest+json' }
  );
  $('manifestLink').href = URL.createObjectURL(manifestBlob);
}

async function registerInlineServiceWorker() {
  if (
    !('serviceWorker' in navigator) ||
    !['http:', 'https:'].includes(location.protocol)
  ) {
    return;
  }

  const swCode = `
    const CACHE_NAME = 'ledsign-single-v1';

    self.addEventListener('install', event => {
      self.skipWaiting();
    });

    self.addEventListener('activate', event => {
      event.waitUntil(
        caches.keys().then(keys =>
          Promise.all(
            keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k))
          )
        ).then(() => self.clients.claim())
      );
    });

    self.addEventListener('fetch', event => {
      if (event.request.method !== 'GET') return;

      event.respondWith(
        caches.match(event.request).then(cached => {
          const networkFetch = fetch(event.request).then(response => {
            if (response && response.ok && response.type === 'basic') {
              const copy = response.clone();
              caches.open(CACHE_NAME).then(cache => cache.put(event.request, copy));
            }
            return response;
          }).catch(() => cached);

          return cached || networkFetch;
        })
      );
    });
  `;

  try {
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(swBlob);
    await navigator.serviceWorker.register(swUrl);
  } catch (error) {
    console.warn('Inline service worker registration skipped:', error);
  }
}

// INITIALIZATION
async function initialize() {
  setupSingleFilePWA();
  updateUI();
  layout();

  requestWakeLock();

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => queueRebuild());
  }

  await registerInlineServiceWorker();

  if (window.matchMedia('(display-mode: standalone)').matches) {
    $('installBtn').hidden = true;
  }
}

initialize();
requestAnimationFrame(drawFrame);

})();
</script>
